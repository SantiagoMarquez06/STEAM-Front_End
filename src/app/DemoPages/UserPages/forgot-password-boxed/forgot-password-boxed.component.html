<div class="vh-100 steam-login-bg">
  <div class="d-flex h-100 justify-content-center align-items-center p-3">
    <div class="w-100 app-login-box" style="max-width: 500px;">
      <div class="steam-login-brand text-center mb-4">
        STEAM
      </div>

      <div class="card shadow-lg border-0">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <h3 class="mb-2 fw-normal">Recuperar clave</h3>
            <p class="text-muted mb-0">
              Ingresa el correo registrado en tu usuario. Te enviaremos tu usuario y una clave temporal.
            </p>
          </div>

          <form id="recoveryForm" (ngSubmit)="onSubmit(recoveryFormRef)" #recoveryFormRef="ngForm">
            <div *ngIf="successMessage" class="alert alert-success" role="alert">
              {{ successMessage }}
            </div>

            <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
              {{ errorMessage }}
            </div>

            <div class="mb-3">
              <label for="emailInput" class="form-label visually-hidden">Correo</label>
              <input
                id="emailInput"
                type="email"
                class="form-control form-control-lg"
                placeholder="Correo registrado"
                name="email"
                ngModel
                required
                autocomplete="email">
            </div>
          </form>
        </div>

        <div class="card-footer bg-transparent border-0 p-4 pt-0">
          <div class="d-flex flex-column flex-sm-row justify-content-between gap-2">
            <a [routerLink]="'/login'" class="btn btn-link btn-lg text-decoration-none">
              Volver al login
            </a>
            <button type="submit" class="btn btn-primary btn-lg px-4" form="recoveryForm" [disabled]="loading">
              <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
              {{ loading ? 'Enviando...' : 'Enviar clave temporal' }}
            </button>
          </div>
        </div>
      </div>

      <div class="text-center text-white mt-4">
        <p class="mb-0 opacity-75 small">
          Copyright 2026 - STEAM
        </p>
      </div>
    </div>
  </div>
</div>
